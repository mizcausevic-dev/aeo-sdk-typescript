name: Publish to npm

# Fires on a semver tag. Builds the dist/ output, verifies the package.json
# version matches the tag, and publishes to npm.
#
# REQUIRED REPO SECRET: NPM_TOKEN
#   - Create an npm Automation token at https://www.npmjs.com/settings/<user>/tokens
#   - Add it as repo secret NPM_TOKEN under Settings → Secrets and variables → Actions
#
# If you prefer OIDC (no token) and have npm Trusted Publishing configured,
# replace the publish step with `npm publish --provenance --access public` and
# drop the NODE_AUTH_TOKEN env var.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # for npm provenance attestation

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Git tag ($TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Verify package contents
        run: |
          npm pack --dry-run --json | node -e 'let json=""; process.stdin.on("data", chunk => json += chunk).on("end", () => { const files = JSON.parse(json)[0].files.map(file => file.path); if (!files.includes("dist/index.js") || !files.includes("dist/index.d.ts") || files.some(file => /^(src|tests)\/|(^|\/)\.env/.test(file))) { console.error("Unexpected npm package contents", files); process.exit(1); } console.log("Package files verified:", files.length); });'
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
