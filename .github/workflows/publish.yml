name: Publish to npm

# Fires on a semver tag. Builds the dist/ output, verifies the package.json
# version matches the tag, and publishes to npm.
#
# REQUIRED REPO SECRET: NPM_TOKEN
#   - Create an npm Automation token at https://www.npmjs.com/settings/<user>/tokens
#   - Add it as repo secret NPM_TOKEN under Settings → Secrets and variables → Actions
#
# If you prefer OIDC (no token) and have npm Trusted Publishing configured,
# replace the publish step with `npm publish --provenance --access public` and
# drop the NODE_AUTH_TOKEN env var.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # for npm provenance attestation

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Git tag ($TAG) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
      - run: npm run build --if-present
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
